<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My FPS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com"></script>

</head>

<body>

    <canvas id="crosshair"></canvas>
    <div id="p2p-panel" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(0,0,0,0.5);padding:8px 10px;border-radius:8px;color:#fff;font:14px/1.2 Arial;display:flex;gap:8px;align-items:center;">
        <label for="p2p-room">Room</label>
        <input id="p2p-room" value="fps-room" style="width:110px;padding:4px 6px;border-radius:5px;border:1px solid #aaa;" />
        <button id="p2p-join" style="padding:4px 8px;border-radius:5px;border:none;cursor:pointer;">Join</button>
    </div>
    <a class="controls-link" href="controls.html">CONTROLS</a>

    <div id="mobile-controls">
        <div id="mobile-joystick"><div id="joystick-knob"></div></div>
        <div id="mobile-look"></div>
        <div class="mobile-actions">
            <button data-action="aim">AIM</button>
            <button data-action="shoot">FIRE</button>
            <button data-action="melee">MELEE</button>
            <button data-action="jump">JUMP</button>
            <button data-action="crouch">CROUCH</button>
            <button data-action="reload">RELOAD</button>
            <button data-weapon="gun">GUN</button>
            <button data-weapon="toaster">TOAST</button>
            <button data-weapon="pistol">PISTOL</button>
            <button data-weapon="knife">KNIFE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="game.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</body>
</html>
