<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My FPS - Controls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="controls-page">
    <main class="controls-panel">
        <p class="eyebrow">MY FPS</p>
        <h1>CONTROLS</h1>
        <div class="controls-list">
            <div><span>W A S D</span><strong>Move</strong></div>
            <div><span>MOUSE</span><strong>Look around</strong></div>
            <div><span>LEFT CLICK</span><strong>Shoot</strong></div>
            <div><span>RIGHT CLICK</span><strong>Aim</strong></div>
            <div><span>F</span><strong>Melee attack</strong></div>
            <div><span>R</span><strong>Reload</strong></div>
            <div><span>1 / 2 / 3 / 4</span><strong>Select weapon</strong></div>
            <div><span>SHIFT</span><strong>Sprint</strong></div>
            <div><span>CTRL</span><strong>Crouch</strong></div>
            <div><span>SPACE</span><strong>Jump</strong></div>
        </div>
        <a class="back-link" href="index.html">BACK TO GAME</a>
    </main>
</body>
</html>
